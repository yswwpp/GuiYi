    <h1>GuiYi 测试文章</h1>
    <p>这是一个用于测试网页抓取功能的本地页面。</p>

    <h2>项目介绍</h2>
    <p>GuiYi（归一）是一个本地优先的个人知识收集与检索系统。核心功能包括：</p>
    <ul>
        <li>一键保存网页链接</li>
        <li>语义搜索引擎</li>
        <li>多数据源聚合</li>
        <li>增量同步机制</li>
    </ul>

    <h2>技术栈</h2>
    <p>后端使用 Python + FastAPI，前端使用 Swift + SwiftUI。语义索引采用 txtai + BAAI/bge-m3 模型。</p>

    <h2>开发进度</h2>
    <p>目前处于第一阶段：核心引擎验证。主要目标是跑通网页抓取、Obsidian 存储和语义索引流程。</p>
