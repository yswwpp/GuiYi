<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WPS GuiYi Sync</title>
  <style>
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 12px;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    .status-badge {
      font-size: 12px;
      padding: 2px 8px;
      background: #e0e0e0;
      border-radius: 4px;
    }
    .status-badge.wps {
      background: #e8f5e9;
      color: #0a0;
    }
    .status-badge.not-wps {
      background: #ffebee;
      color: #c00;
    }
    .panel {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .doc-info {
      margin-bottom: 8px;
    }
    .doc-type {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .sync-info {
      font-size: 12px;
      margin-top: 8px;
    }
    .synced {
      color: #0a0;
    }
    .not-synced {
      color: #888;
    }
    .sync-button {
      width: 100%;
      padding: 10px 16px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .sync-button:hover {
      background: #1557b0;
    }
    .sync-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .sync-button.syncing {
      background: #888;
    }
    .message {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }
    .message.success {
      background: #e6f4ea;
      color: #0a0;
    }
    .message.error {
      background: #fce8e6;
      color: #c00;
    }
    .not-wps-message {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .not-wps-message p {
      margin: 4px 0;
      font-size: 13px;
    }
    .document-list {
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .document-list.empty {
      text-align: center;
      padding: 12px;
      color: #666;
      font-size: 13px;
    }
    .list-header {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .list-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item:last-child {
      border-bottom: none;
    }
    .item-title {
      font-size: 13px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .item-time {
      font-size: 11px;
      color: #999;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid #ddd;
      font-size: 12px;
    }
    .footer a {
      color: #1a73e8;
      cursor: pointer;
      text-decoration: none;
    }
    .loading {
      text-align: center;
      padding: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WPS GuiYi 同步</h1>
    <span id="statusBadge" class="status-badge">检测中...</span>
  </div>

  <div id="content">
    <div class="loading">检测页面中...</div>
  </div>

  <div class="document-list" id="documentList">
    <div class="list-header">最近同步</div>
    <div class="loading">加载中...</div>
  </div>

  <div class="footer">
    <a href="http://localhost:8765" target="_blank">GuiYi 服务</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
